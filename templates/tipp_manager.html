<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipp Manager</title>
<style>
  :root {
    --bg: #0b0f1a; --card: #131929; --border: #1e2d45;
    --green: #22c55e; --gold: #f59e0b; --blue: #3b82f6;
    --red: #ef4444; --purple: #a855f7; --orange: #f97316;
    --text: #e2e8f0; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px;
           display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; font-weight: 700; }
  header a { color: var(--muted); font-size: 13px; text-decoration: none; }
  .toolbar { padding: 20px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
  .btn:hover { opacity: .85; } .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--green); color: #000; }
  .btn-publish { background: var(--gold); color: #000; }
  #status { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 0 24px 120px; }
  .tip-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .2s; }
  .tip-card.t-single  { border-color: var(--green); }
  .tip-card.t-combo   { border-color: var(--orange); }
  .tip-card.t-free    { border-color: var(--purple); }
  .tip-card.t-skip    { border-color: var(--border); opacity: .4; }
  .card-top { display: flex; align-items: flex-start; gap: 10px; }
  .odds { font-size: 20px; font-weight: 800; color: var(--gold); flex-shrink: 0; }
  .match { font-size: 13px; font-weight: 600; line-height: 1.4; }
  .pick  { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .commence { font-size: 11px; color: var(--muted); }
  .note-area { width: 100%; background: #0d1626; border: 1px solid var(--border); border-radius: 6px;
               color: var(--text); font-size: 12px; padding: 8px; resize: vertical; min-height: 56px; font-family: inherit; }
  .seg-row { display: flex; align-items: center; gap: 8px; }
  .seg-label { font-size: 11px; color: var(--muted); width: 65px; flex-shrink: 0; }
  .segs { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg { padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: transparent;
          color: var(--muted); font-size: 11px; cursor: pointer; font-weight: 600; }
  .seg.on-single { background:#1e3a2f; color:var(--green); border-color:var(--green); }
  .seg.on-combo  { background:#3a2510; color:var(--orange); border-color:var(--orange); }
  .seg.on-free   { background:#2d1f3a; color:var(--purple); border-color:var(--purple); }
  .seg.on-skip   { background:#2a1515; color:var(--red); border-color:var(--red); }
  .seg.on-perc90 { background:#1e3a2f; color:var(--green); border-color:var(--green); }
  .seg.on-mondo  { background:#1e2a4a; color:var(--blue); border-color:var(--blue); }
  .seg.on-both   { background:#2d2a10; color:var(--gold); border-color:var(--gold); }
  .publish-bar { position:fixed; bottom:0; left:0; right:0; background:#0d1220; border-top:1px solid var(--border);
                 padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .pub-summary { font-size:13px; color:var(--muted); flex:1; }
  .combo-preview { background:#0d1626; border:1px solid var(--orange); border-radius:8px; padding:12px;
                   font-size:12px; color:#94a3b8; }
  .combo-preview h4 { color:var(--orange); font-size:13px; margin-bottom:8px; }
  .combo-leg { padding:3px 0; border-bottom:1px solid var(--border); }
  .combo-leg:last-child { border:none; }
  .spinner { display:inline-block; width:16px; height:16px; border:2px solid #333;
              border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<header>
  <h1>🎯 Tipp Manager</h1>
  <a href="/admin/upload">← Admin</a>
</header>
<div class="toolbar">
  <button class="btn btn-primary" id="genBtn" onclick="generate()">🔄 Generálás</button>
  <button class="btn" style="background:#1e293b;color:#94a3b8;border:1px solid #334155" onclick="clearTips()">🗑️ Törlés</button>
  <span id="status">Kattints a generálásra a napi tippek lekéréséhez.</span>
</div>
<div class="grid" id="grid"></div>
<div id="comboSection" style="padding:0 24px 16px;display:none">
  <div class="combo-preview" id="comboPreview">
    <h4>🎰 Összerakott kombinációk</h4>
    <div id="comboLegs"></div>
    <div style="margin-top:8px;color:var(--gold)" id="comboOdds"></div>
  </div>
</div>
<div class="publish-bar" id="publishBar" style="display:none">
  <div class="pub-summary" id="pubSummary"></div>
  <button class="btn btn-publish" onclick="publish()">📤 Közzététel</button>
</div>

<script>
let tips = [];
const PERC90_URL = "https://90perc.hu";
const STORAGE_KEY = "tipp_manager_tips";

function saveTips() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tips)); } catch(e) {}
}

function loadTips() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || !saved.length) return false;
    tips = saved;
    return true;
  } catch(e) { return false; }
}

function clearTips() {
  localStorage.removeItem(STORAGE_KEY);
  tips = [];
  document.getElementById("grid").innerHTML = "";
  document.getElementById("publishBar").style.display = "none";
  document.getElementById("comboSection").style.display = "none";
  document.getElementById("status").textContent = "Tippek törölve. Kattints a generálásra.";
}

// Betöltés induláskor
window.addEventListener("DOMContentLoaded", () => {
  if (loadTips()) {
    document.getElementById("status").textContent =
      `💾 ${tips.length} mentett tipp betöltve – folytathatod a szerkesztést.`;
    renderTips();
  }
});

async function generate() {
  const btn = document.getElementById("genBtn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Generálás... (~30-60 mp)';
  document.getElementById("grid").innerHTML = "";
  document.getElementById("publishBar").style.display = "none";
  document.getElementById("comboSection").style.display = "none";
  try {
    const r = await fetch("/admin/generate-tips-raw", { method: "POST" });
    const text = await r.text();
    let data;
    try { data = JSON.parse(text); } catch(e) {
      throw new Error("Szerver hiba: " + text.slice(0, 100));
    }
    if (data.error) throw new Error(data.error);
    tips = (data.tips || []).map(t => ({ ...t, _role: "single", _platform: "both" }));
    saveTips();
    status.textContent = `✅ ${tips.length} tipp generálva (${data.matches_count} meccs alapján)`;
    renderTips();
  } catch(e) { status.textContent = "❌ Hiba: " + e.message; }
  btn.disabled = false;
}

function renderTips() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  tips.forEach((t, i) => grid.appendChild(makeCard(t, i)));
  updateAll();
}

function makeCard(t, i) {
  const d = document.createElement("div");
  d.id = "card-" + i;
  d.className = "tip-card t-single";
  d.innerHTML = `
    <div class="card-top">
      <div style="flex:1">
        <div class="match">${t.match}</div>
        <div class="pick">${t.market} · <b>${t.pick}</b></div>
        <div class="commence">🕐 ${t.commence || ""}</div>
      </div>
      <div class="odds">${t.odds}</div>
    </div>
    <textarea class="note-area" id="note-${i}" placeholder="Indoklás…" oninput="saveTips()">${t.note || ""}</textarea>
    <div class="seg-row">
      <span class="seg-label">Típus</span>
      <div class="segs" id="type-${i}">
        <button class="seg on-single" onclick="setRole(${i},'single')">⚽ Single</button>
        <button class="seg" onclick="setRole(${i},'combo')">🎰 Kombi láb</button>
        <button class="seg" onclick="setRole(${i},'free')">🆓 Free</button>
        <button class="seg" onclick="setRole(${i},'skip')">🗑️ Kihagy</button>
      </div>
    </div>
    <div class="seg-row" id="plat-row-${i}">
      <span class="seg-label">Platform</span>
      <div class="segs" id="plat-${i}">
        <button class="seg" onclick="setPlat(${i},'perc90')">90perc.hu</button>
        <button class="seg" onclick="setPlat(${i},'mondo')">mondomatutit</button>
        <button class="seg on-both" onclick="setPlat(${i},'both')">Mindkettő</button>
      </div>
    </div>`;
  return d;
}

function setRole(i, v) {
  tips[i]._role = v;
  const card = document.getElementById("card-" + i);
  card.className = "tip-card t-" + v;
  card.querySelectorAll("#type-" + i + " .seg").forEach((b, bi) => {
    const roles = ["single","combo","free","skip"];
    b.className = "seg" + (roles[bi] === v ? " on-" + v : "");
  });
  // Platform sor elrejtése skip esetén
  document.getElementById("plat-row-" + i).style.display = v === "skip" ? "none" : "";
  updateAll(); saveTips();
}

function setPlat(i, v) {
  tips[i]._platform = v;
  document.querySelectorAll("#plat-" + i + " .seg").forEach((b, bi) => {
    const plats = ["perc90","mondo","both"];
    b.className = "seg" + (plats[bi] === v ? " on-" + v : "");
  });
  updateAll(); saveTips();
}

function updateAll() {
  updateComboPreview();
  updatePublishBar();
}

function updateComboPreview() {
  const comboLegs = tips.filter(t => t._role === "combo");
  const section = document.getElementById("comboSection");
  if (!comboLegs.length) { section.style.display = "none"; return; }
  section.style.display = "block";
  const totalOdds = comboLegs.reduce((p, t) => p * t.odds, 1).toFixed(2);
  document.getElementById("comboLegs").innerHTML = comboLegs.map(t =>
    `<div class="combo-leg">• ${t.match}: <b>${t.pick}</b> @ ${t.odds} 🕐 ${t.commence||""}</div>`
  ).join("");
  document.getElementById("comboOdds").textContent = `Össz odds: ${totalOdds} · ${comboLegs.length} láb`;
}

function updatePublishBar() {
  const active = tips.filter(t => t._role !== "skip");
  const bar = document.getElementById("publishBar");
  if (!active.length) { bar.style.display = "none"; return; }
  bar.style.display = "flex";
  const singles = active.filter(t => t._role === "single").length;
  const comboLegs = active.filter(t => t._role === "combo").length;
  const frees = active.filter(t => t._role === "free").length;
  document.getElementById("pubSummary").textContent =
    `${singles} single · ${comboLegs} kombi láb → 1 kombi · ${frees} free · közzétehető`;
}

async function publish() {
  const active = tips.filter(t => t._role !== "skip");
  if (!active.length) return alert("Nincs kiválasztott tipp!");

  // 90perc.hu hívás proxy-n megy, jelszó a szerveren

  const comboLegs = active.filter(t => t._role === "combo");
  const singles   = active.filter(t => t._role === "single");
  const frees     = active.filter(t => t._role === "free");

  // Kombi összerakása a lábakból
  const comboNote = comboLegs.map((t, i) =>
    `${i+1}. ${t.match} (${t.pick}): ${getNoteVal(t)}`
  ).join("\n");
  const comboOdds = comboLegs.reduce((p, t) => p * t.odds, 1).toFixed(2);

  let ok = 0, errors = [];

  const sendTip = async (platform, body) => {
    if (platform === "perc90" || platform === "both") {
      try {
        const r = await fetch("/admin/proxy-perc90", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (r.ok) ok++; else errors.push("90perc: " + (await r.text()).slice(0,60));
      } catch(e) { errors.push("90perc proxy hiba: " + e.message); }
    }
    if (platform === "mondo" || platform === "both") {
      try {
        const r = await fetch("/admin/import-tip", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (r.ok) ok++; else errors.push("mondo: " + (await r.text()).slice(0,60));
      } catch(e) { errors.push("mondo hálózati hiba"); }
    }
  };

  // Singlek küldése
  for (const t of singles) {
    await sendTip(t._platform, {
      type: "single", match: t.match, pick: t.pick, market: t.market,
      odds: t.odds, note: getNoteVal(t), commence: t.commence
    });
  }

  // Kombi küldése (ha van)
  if (comboLegs.length >= 2) {
    const comboPlatform = comboLegs.some(t => t._platform === "perc90") ? "perc90"
                        : comboLegs.some(t => t._platform === "both")   ? "both"
                        : "mondo";
    await sendTip(comboPlatform, {
      type: "combo",
      legs: comboLegs.map(t => ({ match: t.match, pick: t.pick, market: t.market,
                                   odds: t.odds, commence: t.commence })),
      odds: parseFloat(comboOdds),
      note: comboNote
    });
  } else if (comboLegs.length === 1) {
    // 1 lábas "kombi" → singleként küldve
    const t = comboLegs[0];
    await sendTip(t._platform, {
      type: "single", match: t.match, pick: t.pick, market: t.market,
      odds: t.odds, note: getNoteVal(t), commence: t.commence
    });
  }

  // Free tipp küldése
  for (const t of frees) {
    await sendTip(t._platform, {
      type: "free", match: t.match, pick: t.pick, market: t.market,
      odds: t.odds, note: getNoteVal(t), commence: t.commence
    });
  }

  const msg = `✅ ${ok} küldés sikeres` + (errors.length ? ` · ❌ ${errors.join(", ")}` : "");
  alert(msg);
  document.getElementById("status").textContent = msg;
}

function getNoteVal(t) {
  const i = tips.indexOf(t);
  return (document.getElementById("note-" + i)?.value || t.note || "").trim();
}
</script>
</body>
</html>
